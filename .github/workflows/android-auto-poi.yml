name: Android Auto POI PoC

on:
  push:
    branches: [main, feature/task-003-poc-aa-001]
    paths:
      - "poc/android-auto-poi/**"
      - ".github/workflows/android-auto-poi.yml"
  pull_request:
    paths:
      - "poc/android-auto-poi/**"
      - ".github/workflows/android-auto-poi.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: poc/android-auto-poi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK platform
        run: sdkmanager --install "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Compile, unit test, lint
        run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --stacktrace

      - name: Publish debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bauto-poi-debug-apk
          path: poc/android-auto-poi/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
